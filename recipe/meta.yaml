{% set name = "sphinxcontrib-video" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 18477fd9454ac8c69259e6d24e782d8b802345b6475de6216351c2305b06c898

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - sphinx

test:
  imports:
    - sphinxcontrib
    - sphinxcontrib.video
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/sphinx-contrib/video
  summary: Allows embedding of HTML5 videos in sphinx
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ReimarBauer
    - hmaarrfk
